context: |
  Live Next.js 16 + React 19 application using Anthropic Claude API for brief analysis. Deployed on Railway at pitch-pack-tool-production.up.railway.app. The tool walks users through brief upload, multi-persona triage (5 expert personas), section-by-section review with a four-option builder spectrum (lifted directly through ruthless clarity), audience generation with personification, and 12 human truths on a safer-to-bolder spectrum.

  Supports Expedia, Hotels.com, and Vrbo brand alignment with demographic fit scoring. Features include session persistence, Word/PDF upload, .docx export, per-section AI research prompts, and editable JSON prompt configs. Tech stack includes Tailwind CSS 4, Vitest, mammoth.js for document parsing. Currently at v1.8+ with 47+ tests passing.

  This is a graduated codebase bundle — lives in place, not inside bundles/.
